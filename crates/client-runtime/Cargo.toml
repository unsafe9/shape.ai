[package]
name = "shape_client_runtime"
version = "0.1.0"
edition = "2021"
description = "Pure Rust collaboration session core for shape.ai shells: durable outbox bookkeeping, peer presence registry, viewport windowing decisions, and the optimistic sync engine over scene-core op-apply. No ambient time/rng/threads/IO — clock, persistence, and transport are injected seams."

[lib]
name = "shape_client_runtime"
path = "src/lib.rs"
# cdylib so wasm-pack emits the wasm bundle; rlib so native tests/binaries link it.
crate-type = ["cdylib", "rlib"]

[features]
# `wasm` pulls in wasm-bindgen + the session FFI bridge (`wasm_session.rs`) and
# turns on scene-core's `wasm` feature, so ONE wasm-pack bundle carries BOTH the
# scene-core exports (apply_object_op, catalogs, builders, WasmUndoStack, …) AND
# the new WasmSession. Off by default so native test/build never touch wasm-bindgen.
wasm = ["dep:wasm-bindgen", "shape_scene_core/wasm"]

[dependencies]
shape_scene_core = { path = "../scene-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = { version = "0.2", optional = true }

[lints]
workspace = true
