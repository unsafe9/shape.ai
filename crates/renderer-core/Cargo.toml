[package]
name = "shape_renderer_core"
version = "0.1.0"
edition = "2021"
description = "Pure CPU renderer core for shape.ai infinite canvas (no wgpu/web_sys)."

[lints]
workspace = true

[features]
default = ["wgpu-probe"]
# Compilation gate (no wgpu dependency): toggles the extra CPU render-model and
# stats structs the GPU/native adapter layers consume. Named to mirror the
# renderer-wgpu feature so the two stay in lockstep.
wgpu-probe = []

[dependencies]
bytemuck = { version = "1.25", features = ["derive"] }
# True multi-channel MSDF for world/canvas text: fdsm bakes a 3-channel signed
# distance field from glyph vector outlines (pure-Rust, wasm-safe, no codecs —
# `image` is pulled default-features-off for just its RgbImage buffer). The bridge
# loads outlines from the ttf-parser Face that rustybuzz already holds.
fdsm = "0.8.0"
fdsm-ttf-parser = "0.2.0"
fontdue = { version = "0.9.3", default-features = false, features = ["std"] }
image = { version = "0.25.6", default-features = false }
lyon_tessellation = "1.0"
nalgebra = "0.34.1"
rustybuzz = "0.20.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shape_scene_core = { path = "../scene-core" }
unicode-segmentation = "1"
