[package]
name = "shape_storage_core"
version = "0.1.0"
edition = "2021"
description = "Storage-adapter core for shape.ai: a store-neutral StorageAdapter trait with a single portable, parallel-friendly export/import format, plus real in-memory and file adapters."

[lib]
crate-type = ["rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
