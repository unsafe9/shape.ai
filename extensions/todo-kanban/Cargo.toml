[package]
name = "shape_ext_todo_kanban"
version = "0.1.0"
edition = "2021"
description = "Reference data-rep extension: a list/board (Board{columns[cards]}) that lowers onto the core Flow layout solver — columns are parent groups with Layout, cards are child rects, so solve_layout derives the packing. Proves a layout-shaped domain maps onto scene-core with zero new layout code."

[lints]
workspace = true

[dependencies]
shape_extension_contract = { path = "../extension-contract" }
shape_scene_core = { path = "../../crates/scene-core", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
