[package]
name = "shape_ext_structure_diagram"
version = "0.1.0"
edition = "2021"
description = "Reference data-rep extension (구조도): a node+edge graph that lowers onto the core via connectors/anchors — nodes are rect objects, edges are open 2-node connector objects with anchors identical to templates.rs::connector. Proves a non-layout, relational domain maps onto scene-core (connection_graph/resolve_endpoint work for free)."

[lints]
workspace = true

[dependencies]
shape_extension_contract = { path = "../extension-contract" }
shape_scene_core = { path = "../../crates/scene-core", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
