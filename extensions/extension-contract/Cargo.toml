[package]
name = "shape_extension_contract"
version = "0.1.0"
edition = "2021"
description = "The data-representation extension contract: the seam shape (mcp-register, export-to-scene) every extension implements and the host dispatches over. Pure — no time/rng/IO; depends only on scene-core types."

[lints]
workspace = true

[dependencies]
# The export seam emits scene-core ObjectOps; default-features off keeps
# wasm-bindgen/ts-gen out of the pure contract.
shape_scene_core = { path = "../../crates/scene-core", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
